appId: com.dsh.desktop
productName: DSH Desktop
directories:
  output: dist
  buildResources: build
files:
  - src/**
  - ui/**
  - registry/**
  - example-plugins/**
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: DSH-Desktop-Setup-${version}.exe
portable:
  artifactName: DSH-Desktop-portable-${version}.exe
npmRebuild: false